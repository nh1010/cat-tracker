services:
  api:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 5000
      PYTHONUNBUFFERED: "1"
      SQLITE_DB_PATH: /app/data/cat.db
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # S3 image uploads are used in production. If S3_BUCKET is empty,
      # local development falls back to /app/uploads.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_UPLOAD_PREFIX: ${S3_UPLOAD_PREFIX:-uploads}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      CAPTCHA_REQUIRED: ${CAPTCHA_REQUIRED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change_me_for_reports}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT:-20}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-10}
      EXPORT_RATE_LIMIT: ${EXPORT_RATE_LIMIT:-10}
    ports:
      - "5050:5000"
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
      - ./data:/app/data
      - ./uploads:/app/uploads
    command: ["sh", "-c", "alembic upgrade head && python main.py"]
